data_path: data
dataset_config_path: configs/dataset/hpo_config.yaml # dataset_config.yaml

save:
  directory: results
  run_name: HPO3

# ezek lehet jók később ha d-p-re fókuszálunk
# evaluation_entity_whitelist:
# evaluation_relation_whitelist:

# 2. Model
model: CompGCN
model_kwargs:
  embedding_dim: 128
# 3. Loss
loss: NSSALoss # NSSALoss with larger margin can work eg. 10
loss_kwargs_ranges:
  margin:
    type: categorical
    choices: [5, 10, 15, 20, 30]
# 4. Regularizer
regularizer: 
regularizer_kwargs:
# 5. Optimizer
optimizer: Adam
optimizer_kwargs_ranges:
  lr:
    type: float
    low: 0.001
    high: 0.05
    log: True
# 5.1 Learning Rate Scheduler
lr_scheduler: ExponentialLR  # CosineAnnealingLR, ExponentialLR
lr_scheduler_kwargs_ranges:
  gamma:
    type: float
    low: 0.8
    high: 0.99
    log: True
# 6. Training Loop
training_loop: 
training_loop_kwargs:
negative_sampler: BasicNegativeSampler # BernoulliNegativeSampler, PseudoTypedNegativeSampler
negative_sampler_kwargs:
  num_negs_per_pos: 50
# 7. Training
n_trials: 70
epochs: 200
training_kwargs:
  batch_size: 4096
  checkpoint_frequency: 5
  # checkpoint_name: checkpoint.pth
  checkpoint_on_failure: True
trainer_kwargs_ranges:
stopper: "early"
stopper_kwargs:
  frequency: 5
  patience: 3
  relative_delta: 0.002

# 8. Evaluation
evaluator: 
evaluator_kwargs:
evaluation_kwargs:
  batch_size: 512
# 9. Tracking
result_tracker: "wandb"
result_tracker_kwargs:
  project: CompGCN_HPO3

