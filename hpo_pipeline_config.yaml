data_path: dataset_saves
dataset_config_path: dataset_config.yaml

save:
  directory: results
  run_name: test

# ezek lehet jók később ha d-p-re fókuszálunk
# evaluation_entity_whitelist:
# evaluation_relation_whitelist:

# 2. Model
model: TransE
model_kwargs_ranges:
  embedding_dim:
    type: int
    low: 64
    high: 1024
    step: 64
    log: True
  # entity_initializer:
  #   type: categorical
  #   choices: ["xavier_uniform_", "xavier_normal_", "normal_"]
# 3. Loss
loss: MarginRankingLoss # ez a default az összes modellnél amit néztem, esetleg valami Hinge, vagy BCEwithLogitsLoss?
loss_kwargs_ranges:
  margin:
    type: float
    low: 0.5
    high: 10.0
    step: 0.5
# 4. Regularizer
regularizer: 
regularizer_kwargs:
# 5. Optimizer
optimizer: Adam
optimizer_kwargs_ranges:
  lr:
    type: float
    low: 0.0001
    high: 0.01
    log: True
clear_optimizer: 
# 5.1 Learning Rate Scheduler
lr_scheduler: # ExponentialLR, CosineAnnealingLR
lr_scheduler_kwargs_ranges:
  gamma:
    type: float
    low: 0.8
    high: 0.99
    step: 0.01
# 6. Training Loop
training_loop: 
training_loop_kwargs:
negative_sampler: 
negative_sampler_kwargs:
  num_negs_per_pos: 1
# 7. Training
n_trials: 30
epochs: 1000
training_kwargs:
  checkpoint_name: checkpoint.pth
  checkpoint_frequency: 5
  checkpoint_on_failure: True
trainer_kwargs_ranges:
  batch_size:
    type: int
    low: 128
    high: 1024
    step: 128
    log: True
stopper: "early"
stopper_kwargs:
  frequency: 5
  patience: 3
  relative_delta: 0.002

# 8. Evaluation
evaluator: 
evaluator_kwargs:
evaluation_kwargs:
  batch_size: 64
# 9. Tracking
result_tracker: "wandb"
result_tracker_kwargs:
  project: TransE_HPO
  # tags: test
# Misc
# metadata: 
# device: "cuda"
random_seed: 42
# use_testing_data: True
# evaluation_fallback: True
# filter_validation_when_testing:  True
# use_tqdm: True
