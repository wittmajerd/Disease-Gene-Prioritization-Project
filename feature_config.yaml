data_path: data
# dataset_config_path: dataset_config.yaml # configs/dataset/hpo_config.yaml
dataset_config_path: configs/dataset/disease_protein_homo.yaml

save:
  directory: features_saves
  # directory: random_testing

# Entity features produced by the PrimeKG embedding pipeline.
features:
  enabled: true
  path: primekg/ggd_attention.pickle


# 2. Model
model: CompGCN # TransE, RotatE, CompGCN, RGCN
model_kwargs:
  embedding_dim: 128
  # num_layers: 1
# 3. Loss
loss: NSSALoss # MarginRankingLoss is the default, NSSALoss with larger margin can work eg. 10
loss_kwargs:
  margin: 10.0
  adversarial_temperature: 0.85
# 4. Regularizer
# regularizer: lp
# regularizer_kwargs:
#   p: 3
#   weight: 0.0001
#   normalize: False
# 5. Optimizer
optimizer: Adam
optimizer_kwargs:
  lr: 0.02
clear_optimizer: # False if want to continue training from checkpoint
# 5.1 Learning Rate Scheduler
lr_scheduler: ExponentialLR # CosineAnnealingLR?
lr_scheduler_kwargs:
  gamma: 0.985
# 6. Training Loop
training_loop: # slcwa or lcwa
training_loop_kwargs:
  # automatic_memory_optimization: False
negative_sampler: BasicNegativeSampler # BernoulliNegativeSampler, PseudoTypedNegativeSampler
negative_sampler_kwargs:
  num_negs_per_pos: 50
# 7. Training
epochs: 300
training_kwargs:
  batch_size: 4096
  # num_workers: 4
  pin_memory: True
  checkpoint_name: checkpoint.pth
  # checkpoint_frequency: 10 # minutes
  checkpoint_on_failure: True
  # sampler: schlichtkrull
stopper: "early"
stopper_kwargs:
  frequency: 10
  patience: 3
  relative_delta: 0.005
  metric: mean_reciprocal_rank # hits_at_k, mean_reciprocal_rank

# 8. Evaluation
evaluator: RankBasedEvaluator # MacroRankBasedEvaluator, SampledRankBasedEvaluator
evaluator_kwargs:
  filtered: True
evaluation_kwargs:
  batch_size: 512
# 9. Tracking
result_tracker: "wandb"
result_tracker_kwargs:
  project: features_testing
  # tags: 
  #   - full_ds_with_inverse
  # reinit: finish_previous
# Misc
# metadata: 
# device: "cuda"
# random_seed: 42
# use_testing_data: True
evaluation_fallback: False
# filter_validation_when_testing: True
use_tqdm: True
