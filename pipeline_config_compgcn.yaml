data_path: dataset_saves
dataset_config_path: dataset_config2.yaml # configs/dataset/hpo_config.yaml

save:
  directory: results

# ezek lehet jók később ha d-p-re fókuszálunk
evaluation_entity_whitelist:
evaluation_relation_whitelist: disease_protein

# 2. Model
model: CompGCN # TransE, RotatE, CompGCN, RGCN
model_kwargs:
  embedding_dim: 32
# 3. Loss
loss: MarginRankingLoss # ez a default az összes modellnél de rotate NSSALoss tesztelni
loss_kwargs:
  margin: 1.0
# 4. Regularizer
regularizer: 
regularizer_kwargs:
# 5. Optimizer
optimizer: Adam
optimizer_kwargs:
  lr: 0.001 # kicsit több? 0.005
clear_optimizer: False # False if want to continue training from checkpoint
# 5.1 Learning Rate Scheduler
lr_scheduler: ExponentialLR # CosineAnnealingLR?
lr_scheduler_kwargs:
  gamma: 0.9
# 6. Training Loop
training_loop: slcwa # slcwa or lcwa
training_loop_kwargs:
  automatic_memory_optimization: False
# negative_sampler: BasicNegativeSampler # BernoulliNegativeSampler, PseudoTypedNegativeSampler
negative_sampler_kwargs:
  num_negs_per_pos: 50
# 7. Training
epochs: 75
training_kwargs:
# there is a severe memory limitation bc of the batch norm  it cant use sub batching or slicing so we need to turn of automatic memory optimization and reduce batch size but this runs a few hundred hour an epoch
  batch_size: 8
  checkpoint_name: checkpoint.pth
  # checkpoint_frequency: 10 # minutes
  checkpoint_on_failure: True
stopper: "early"
stopper_kwargs:
  frequency: 60
  patience: 1
  relative_delta: 0.005

# 8. Evaluation
evaluator: 
evaluator_kwargs:
evaluation_kwargs:
  batch_size: 2
# 9. Tracking
# result_tracker: "wandb"
# result_tracker_kwargs:
#   project: Long_train_GCN_wo_early_stopping
# Misc
# metadata: 
# device: "cuda"
random_seed: 42
# use_testing_data: True
evaluation_fallback: False
# filter_validation_when_testing: True
use_tqdm: True
